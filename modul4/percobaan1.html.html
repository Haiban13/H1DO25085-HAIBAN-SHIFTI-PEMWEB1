<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Praktikum Pemrograman Web</title>
</head>
<body>

        let nama = "Andi";
        let usia = 40;
        usia = usia / 2;
        let alamat = "Jl. HR Bunyamin";

        document.write("<h1>Hai, sekarang Anda sedang belajar Javascript!</h1>");
